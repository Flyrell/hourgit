server {
    # IPv4 only. The stock image adds an IPv6 listener from an entrypoint hook
    # that first probes /proc/net/if_inet6, but that hook skips any custom
    # config, and a hardcoded `listen [::]:80` would abort startup on a host
    # without kernel IPv6. Dokploy reaches this container over IPv4.
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    charset       utf-8;
    server_tokens off;

    # TLS is terminated by Traefik in front of this container, so redirects must
    # never echo back the internal scheme/port.
    absolute_redirect off;

    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_min_length 256;
    gzip_types      text/plain
                    text/css
                    text/xml
                    text/javascript
                    application/javascript
                    application/json
                    application/xml
                    image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;

    # A directory without an index page is a missing resource, not a forbidden
    # one — answer 404 instead of exposing a 403 body.
    error_page 403 = @not_found;

    location @not_found {
        return 404;
    }

    # Hidden files are never part of the site.
    location ~ /\. {
        return 404;
    }

    # install.sh is consumed via `curl | bash` — it must render as plain text
    # instead of being offered as a download.
    location ~* \.sh$ {
        default_type text/plain;
        charset      utf-8;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location ~* \.(?:css|js)$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location ~* \.(?:png|jpg|jpeg|gif|svg|ico|webp)$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location / {
        # Directories get the canonical trailing-slash redirect, otherwise the
        # relative links inside the docs pages resolve one level too high.
        if (-d $request_filename) {
            rewrite ^(.+[^/])$ $1/ permanent;
        }

        # Clean URLs: docs pages are linked without the .html extension.
        try_files $uri $uri.html $uri/ =404;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache" always;
    }
}
